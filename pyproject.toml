[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blogagentic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.115.12",
    "google-api-python-client>=2.199.0",
    "google-auth>=2.56.3",
    "google-auth-oauthlib>=1.4.0",
    "google-genai>=2.19.0",
    "langchain>=0.3.25",
    "langchain-community>=0.3.25",
    "langchain-core>=0.3.65",
    "langchain-groq>=0.3.2",
    "langchain-litellm>=0.7.0",
    "langchain-openai>=1.4.3",
    "langgraph>=0.4.8",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-cli[inmem]>=0.3.1",
    "litellm>=1.97.0",
    "mcp>=2.0.0",
    "nemoguardrails>=0.23.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.13.0",
    "streamlit>=1.62.0",
    "tavily-python>=0.8.0",
    "uvicorn>=0.34.3",
    "watchdog>=6.0.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[dependency-groups]
dev = [
    "deepeval>=4.1.10",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

pythonpath = [".", "tests"]

addopts = "-ra"

markers = [
    "evals: DeepEval evaluation tests",
]

[tool.mypy]
exclude = '^evals/'


[[tool.mypy.overrides]]
module = ["nemoguardrails"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "google_auth_oauthlib.*",
    "googleapiclient.*",
]
ignore_missing_imports = true
